[package]
name = "Banner_Scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
atty = "0.2"
clap = { version = "4", features = ["derive"] }
native-tls = "0.2"
quick-xml = "0.31"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
chrono = "0.4.41"
console = "0.15"